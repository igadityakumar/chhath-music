<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chhath Puja Music</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================================
         DARK OVERLAY
    ========================================== -->
    <div class="overlay"></div>


    <!-- =========================================
         MAIN WRAPPER
    ========================================== -->
    <main class="main-section">

        <!-- CANVAS WRAPPER -->
        <div class="canvas-wrapper">

            <!-- =====================================
                 LIVE BACKGROUND OVERLAYS
            ====================================== -->
            <div class="live-background">

                <!-- AGARBATTI SMOKE -->
                <div class="smoke smoke-one"></div>
                <div class="smoke smoke-two"></div>
                <div class="smoke smoke-three"></div>


                <!-- LIVE AGARBATTI SMOKE -->
                <div class="incense-smoke">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>


                <!-- LIVE DIYA FLAMES -->
                <div class="live-diya-flames">
                    <span class="flame-1"></span>
                    <span class="flame-2"></span>
                    <span class="flame-3"></span>
                </div>


                <!-- =================================
                     FLOATING FLOWERS
                ================================== -->
                <div class="flower flower-one">🌸</div>
                <div class="flower flower-two">🌼</div>
                <div class="flower flower-three">🌸</div>
                <div class="flower flower-four">🌼</div>
                <div class="flower flower-five">🌸</div>


                <!-- =================================
                     REALISTIC BIRDS
                ================================== -->
                <div class="bird bird-1">
                    <span class="wing left-wing"></span>
                    <span class="wing right-wing"></span>
                    <span class="bird-body"></span>
                </div>

                <div class="bird bird-2">
                    <span class="wing left-wing"></span>
                    <span class="wing right-wing"></span>
                    <span class="bird-body"></span>
                </div>

                <div class="bird bird-3">
                    <span class="wing left-wing"></span>
                    <span class="wing right-wing"></span>
                    <span class="bird-body"></span>
                </div>

                <div class="bird bird-4">
                    <span class="wing left-wing"></span>
                    <span class="wing right-wing"></span>
                    <span class="bird-body"></span>
                </div>


                <!-- =================================
                     GLOWING PARTICLES
                ================================== -->
                <div class="particle particle-one"></div>
                <div class="particle particle-two"></div>
                <div class="particle particle-three"></div>
                <div class="particle particle-four"></div>
                <div class="particle particle-five"></div>

            </div>


            <!-- =====================================
                 WEBSITE TITLE
            ====================================== -->
            <div class="website-title">

                <h1>छठ पूजा</h1>

                <p>
                    C H H A T H &nbsp; P U J A
                </p>

            </div>

        </div>

    </main>


    <!-- =========================================
         TOP BAR
    ========================================== -->
    <header class="top-bar">

        <div class="left-info">

            <span id="clock">
                9:24 AM
            </span>

            <span class="divider">
                |
            </span>

            <span class="online-dot"></span>

            <span>
                <b id="listeners">245</b>
                listening
            </span>

        </div>


        <!-- SUPPORT BUTTON -->
        <button
            class="support-btn"
            id="supportBtn"
            type="button">

             Support 🌸

        </button>

    </header>


    <!-- =========================================
         MUSIC PLAYER
    ========================================== -->
    <div class="music-player">


        <!-- COVER -->
        <div class="cover-box">

            <img
                id="songCover"
                src="assets/song1.jpg"
                alt="Chhath Song">

        </div>


        <!-- SONG DETAILS -->
        <div class="song-details">

            <h3 id="songTitle">
                Chhath Puja Song 1
            </h3>

            <p id="songArtist">
                Chhath Music
            </p>


            <!-- PROGRESS -->
            <div class="progress-area">

                <span id="currentTime">
                    0:00
                </span>

                <input
                    type="range"
                    id="progressBar"
                    min="0"
                    max="100"
                    value="0">

                <span id="duration">
                    0:00
                </span>

            </div>

        </div>


        <!-- =====================================
             MUSIC CONTROLS
        ====================================== -->
        <div class="controls">

            <button
                id="previousBtn"
                class="control-btn"
                type="button"
                aria-label="Previous Song">

                ⏮

            </button>


            <button
                id="playBtn"
                class="play-btn"
                type="button"
                aria-label="Play">

                ▶

            </button>


            <button
                id="nextBtn"
                class="control-btn"
                type="button"
                aria-label="Next Song">

                ⏭

            </button>

        </div>

    </div>





    <!-- =========================================
         ADITYA SUPPORT POPUP
    ========================================== -->
    <div
        class="support-popup"
        id="supportPopup">

        <div class="support-card">


            <!-- CLOSE -->
            <button
                class="support-close"
                id="supportClose"
                type="button"
                aria-label="Close">

                ×

            </button>


            <!-- HEART -->
            <div class="support-heart">
                ❤️
            </div>


            <!-- TITLE -->
            <h2>
                Made with Love
            </h2>


            <!-- MAIN MESSAGE -->
            <p class="support-main">

                This Chhath Puja Music website
                is lovingly created by
                <strong>Aditya</strong>.

            </p>

<p clas="support-small">
    ❤️
</p>


            <!-- SIGNATURE -->
            <div class="support-sign">

                — Aditya

            </div>

        </div>

    </div>


    <!-- =========================================
         AUDIO PLAYER
    ========================================== -->
    <audio
        id="audioPlayer"
        preload="metadata">
    </audio>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->
    <script src="script.js"></script>

</body>

</html>
